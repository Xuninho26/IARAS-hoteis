<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IARAS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>

<body>

<nav id="navbar" class="container">
  <h1>IARAS</h1>
  <button class="nav-toggle" aria-label="Abrir menu" aria-expanded="false">☰</button>
  <div class="menu" role="navigation" aria-label="Menu principal">
    <a href="#home">Início</a>
    <a href="#experiencias">Experiências</a>
    <a href="reservas.html">Reservas</a>
  </div>
  <button class="btn">Reservar</button>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <h1>Descubra a Amazônia em Luxo Sustentável</h1>
    <p>Experiências autênticas na maior floresta tropical do mundo.</p>
    <div class="hero-btns">
      <button class="btn btn-primary" onclick="document.getElementById('modal').style.display='flex'">Reservar</button>
      <button class="btn btn-secondary" onclick="document.getElementById('hoteis').scrollIntoView({ behavior: 'smooth' })">Saiba mais</button>
    </div>
  </div>
</section>

<!-- HOTÉIS -->
<section class="hoteis" id="hoteis">
  <h2>Hotéis em Destaque</h2>

  <div class="cards-container">
    <a href="hotel.html" class="card-link">
      <div class="card">
        <div class="card-image" style="background-image:url('seven.jpg')"></div>
        <h3>Seven Hotel</h3>
        <p>Conforto moderno</p>
      </div>
    </a>
  </div>
</section>

<!-- EXPERIÊNCIAS -->
<section id="experiencias">
  <h2>Experiências</h2>
</section>

<footer class="footer">
  <p>© 2026 IARAS</p>
</footer>

<!-- 🔥 MODAL (LOGIN + RESERVA) -->
<div id="modal" class="modal">

  <!-- LOGIN -->
  <div id="loginBox" class="modal-content" style="display:none;">
    <h2>Login</h2>

    <input id="email" type="email" placeholder="Email">
    <input id="senha" type="password" placeholder="Senha">

    <button onclick="login()">Entrar</button>
    <button onclick="cadastro()">Criar conta</button>
  </div>

  <!-- RESERVA -->
  <div id="reservaBox" class="modal-content">
    <span class="close">&times;</span>
    <h2>Fazer Reserva</h2>

    <input type="text" placeholder="Seu nome">
    <input type="date">

    <select>
      <option>Escolha um hotel</option>
      <option>Seven Hotel</option>
      <option>TAKANA</option>
      <option>Hotel Maylu</option>
    </select>

    <button class="btn" id="confirmar">Confirmar Reserva</button>
  </div>

</div>

<!-- 🔥 FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } 
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCfCMWaSC4c1_VFvoU5WezSNjNCSpi8nf8",
    authDomain: "iaras-bcd8c.firebaseapp.com",
    projectId: "iaras-bcd8c",
    storageBucket: "iaras-bcd8c.firebasestorage.app",
    messagingSenderId: "653008865243",
    appId: "1:653008865243:web:f0814097bbf9729bb989fe"
  };

  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);
  const auth = getAuth(app);

  window.db = db;
  window.addDoc = addDoc;
  window.collection = collection;

  window.auth = auth;
  window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
  window.signInWithEmailAndPassword = signInWithEmailAndPassword;
</script>

<!-- ⚙️ LÓGICA DO SISTEMA -->
<script>
// Elements
const modal = document.getElementById("modal");
const loginBox = document.getElementById("loginBox");
const reservaBox = document.getElementById("reservaBox");

const btn = document.querySelector("nav .btn");
const close = document.querySelector(".close");
const confirmar = document.getElementById("confirmar");
const navToggle = document.querySelector('.nav-toggle');
const menu = document.querySelector('#navbar .menu');

// Mobile menu toggle
if (navToggle) {
  navToggle.addEventListener('click', () => {
    const open = menu.classList.toggle('open');
    navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  // close menu when clicking links
  menu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
    menu.classList.remove('open');
    navToggle.setAttribute('aria-expanded', 'false');
  }));
}

// shrink navbar on scroll
const navbar = document.getElementById('navbar');
function onScroll() {
  if (window.scrollY > 20) navbar.classList.add('scrolled');
  else navbar.classList.remove('scrolled');
}
window.addEventListener('scroll', onScroll);
onScroll();

// close mobile menu on resize
window.addEventListener('resize', () => {
  if (window.innerWidth > 720 && menu.classList.contains('open')) {
    menu.classList.remove('open');
    if (navToggle) navToggle.setAttribute('aria-expanded', 'false');
  }
});

// abrir modal
btn.onclick = () => {
  modal.style.display = "flex";
  reservaBox.style.display = "block";
  loginBox.style.display = "none";
};

// fechar modal
close.onclick = () => modal.style.display = "none";

window.onclick = (e) => {
  if (e.target == modal) modal.style.display = "none";
};

// RESERVA
confirmar.onclick = async () => {
  const nome = document.querySelector("#reservaBox input[type='text']").value;
  const data = document.querySelector("#reservaBox input[type='date']").value;
  const hotel = document.querySelector("#reservaBox select").value;

  if (!nome || !data || hotel === "Escolha um hotel") {
    alert("Preencha todos os campos!");
    return;
  }

  try {
    await window.addDoc(window.collection(window.db, "reservas"), {
      nome,
      data,
      hotel,
      criadoEm: new Date()
    });

    alert("Reserva salva na nuvem ☁️🔥");
    modal.style.display = "none";

  } catch (e) {
    alert("Erro ao salvar!");
    console.error(e);
  }
};

// LOGIN
async function cadastro() {
  const email = document.getElementById("email").value;
  const senha = document.getElementById("senha").value;

  try {
    await window.createUserWithEmailAndPassword(window.auth, email, senha);
    alert("Conta criada!");
  } catch (e) {
    alert(e.message);
  }
}

async function login() {
  const email = document.getElementById("email").value;
  const senha = document.getElementById("senha").value;

  try {
    await window.signInWithEmailAndPassword(window.auth, email, senha);
    alert("Login feito!");

    loginBox.style.display = "none";
    reservaBox.style.display = "block";

  } catch (e) {
    alert(e.message);
  }
}
</script>

</body>
</html>
